<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#bdbdbd}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="../src/loc.js"></script><script src="../src/model.js"></script><script src="../src/render-core.js"></script><script src="../src/costumes.js"></script><script src="../src/pixel.js"></script>
<script>
const mode = new URLSearchParams(location.search).get('mode') || 'coats';
const items = [];
const poses = ['sit', 'walk', 'walk2', 'run', 'loaf', 'sleep', 'jump', 'hiss', 'climb'];
if (mode === 'coats') K.coatPresets.forEach((p) => poses.forEach((pose, i) => items.push({ coat: p.id, pose, ph: i === 2 ? 1.6 : 0.3 })));
if (mode === 'costumes') K.outfitOptions.filter((o) => o.id !== 'none').forEach((o) => ['sit', 'walk', 'sleep', 'jump'].forEach((pose) => items.push({ coat: 'grayWhite', outfit: o.id, pose, ph: 0.3 })));
if (mode === 'hats') { const coats = ['grayWhite', 'ginger', 'black', 'white', 'calico', 'siamese', 'brownTabby', 'blue']; K.hatOptions.filter((o) => o.id !== 'none').forEach((o, i) => { ['sit', 'walk'].forEach((pose) => items.push({ coat: coats[i % 8], hat: o.id, pose, ph: 0.3 })); }); }
const cols = mode === 'coats' ? 9 : mode === 'costumes' ? 8 : 8, cw = 96, ch = 100;
const rows = Math.ceil(items.length / cols), cv = document.getElementById('c'); cv.width = cols * cw; cv.height = rows * ch;
const ctx = cv.getContext('2d'); ctx.fillStyle = '#bdbdbd'; ctx.fillRect(0, 0, cv.width, cv.height);
items.forEach((it, i) => {
  const cfg = K.newCat('x', it.coat, K.preset(it.coat).eyes, 1); cfg.seed = 777; cfg.hat = it.hat || 'none'; cfg.outfit = it.outfit || 'none';
  const look = K.makeLook(cfg), pose = it.pose === 'walk2' ? 'walk' : it.pose;
  const ri = { pose, facing: 1, phase: it.ph, t: 1, eyes: 'open', look: {x:0,y:0}, climbSide: -1, rotation: 0, progress: 0.3 };
  const c = { look, scale: 1.3, x: (i % cols) * cw + cw / 2, y: 100 - 12 };
  const H = 100; ctx.save(); ctx.translate(0, Math.floor(i / cols) * ch); K.pixel.drawCat(ctx, c, ri, H, 1.0); ctx.restore();
});
window.__ready = true;
</script></body></html>
