<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="256" height="256"></canvas>
<script src="../src/loc.js"></script><script src="../src/model.js"></script><script src="../src/render-core.js"></script>
<script src="../src/costumes.js"></script><script src="../src/render-draw.js"></script><script src="../src/hoods.js"></script>
<script>
const ctx = document.getElementById('c').getContext('2d');
const cfg = K.newCat('icon', 'ginger', 'green', 1);
cfg.seed = 5;
const ri = { pose: 'sit', facing: 1, phase: 0, t: 0.6, eyes: 'open', look: { x: 0, y: 0 }, mouthOpen: false, climbSide: -1, rotation: 0, shake: 0, blush: false, swing: 0, progress: 0 };
// a rounded orange tile with the cat on it, so the icon reads on dark and light taskbars
ctx.fillStyle = '#fff4e6'; const r = 52; ctx.beginPath(); ctx.roundRect(8, 8, 240, 240, r); ctx.fill();
ctx.save(); ctx.translate(128 + 6, 236); ctx.scale(5.6, -5.6);
K.draw(new K.G(ctx), K.makeLook(cfg), ri);
ctx.restore();
</script></body></html>
