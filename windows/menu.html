<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src data:">
  <title>Kotiki</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #26252a; --muted: #7a7882; --card: rgba(0,0,0,0.05); --line: rgba(0,0,0,0.1);
      --accent: #e8913a; --btn: rgba(0,0,0,0.07); --danger: #d93a3a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #2a2a2e; --fg: #f1f0f3; --muted: #a09fa8; --card: rgba(255,255,255,0.07); --line: rgba(255,255,255,0.12); --btn: rgba(255,255,255,0.1); }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 13px "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif; user-select: none; }
    body { overflow-y: auto; padding: 16px; border-radius: 10px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 14px; margin: 14px 0 6px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; }
    .muted { color: var(--muted); font-size: 12px; }
    .small { font-size: 11px; color: var(--muted); line-height: 1.5; }
    button { font: inherit; color: inherit; background: var(--btn); border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    button.primary { background: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 10px; font-size: 14px; }
    button.icon { padding: 5px 7px; background: transparent; font-size: 15px; }
    button.danger { color: var(--danger); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cat { background: var(--card); border-radius: 10px; padding: 8px; display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
    .cat.hidden canvas { opacity: 0.4; }
    .cat .name { font-weight: 600; }
    .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; margin-top: 3px; }
    .bar { display: flex; align-items: center; gap: 3px; font-size: 9px; }
    .bar i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: block; }
    .bar b { display: block; height: 100%; border-radius: 3px; }
    .switch { position: relative; width: 40px; height: 22px; background: var(--line); border-radius: 11px; cursor: pointer; flex: none; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #fff; transition: left .12s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .switch.on { background: var(--accent); }
    .switch.on::after { left: 20px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
    .tiles { display: grid; gap: 6px; }
    .tiles.c4 { grid-template-columns: repeat(4, 1fr); }
    .tiles.c3 { grid-template-columns: repeat(3, 1fr); }
    .tile { background: var(--card); border-radius: 8px; padding: 4px; text-align: center; cursor: pointer; border: 2px solid transparent; }
    .tile.sel { border-color: var(--accent); }
    .tile span { display: block; font-size: 9px; line-height: 1.2; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    input[type=text] { width: 100%; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; user-select: text; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    select { font: inherit; color: inherit; background: var(--btn); border: 0; border-radius: 8px; padding: 6px 8px; }
    .eye { display: inline-flex; gap: 1px; padding: 5px; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; margin-right: 6px; }
    .eye.sel { border: 2px solid var(--accent); padding: 4px; }
    .eye i { width: 12px; height: 12px; border-radius: 6px; display: block; }
    .warn { color: var(--accent); font-size: 11px; margin: 4px 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="src/loc.js"></script>
  <script src="src/model.js"></script>
  <script src="src/render-core.js"></script>
  <script src="src/costumes.js"></script>
  <script src="src/render-draw.js"></script>
  <script src="src/hoods.js"></script>
  <script src="src/pixel.js"></script>
  <script src="menu.js"></script>
</body>
</html>
